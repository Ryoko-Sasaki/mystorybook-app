name: Publish Storybook

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx chromatic --project-token "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" --exit-zero-on-changes
